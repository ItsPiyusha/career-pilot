
# Microsoft SDE Job Scraper — career-pilot
name: Microsoft Jobs Scraper
 
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
 
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Install Playwright browser
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
 
      - name: Run scraper
        run: python scraper.py
        env:
          PYTHONUNBUFFERED: "1"
 
      - name: Check for new jobs
        id: check
        run: |
          if [ -f new_jobs.csv ]; then
            COUNT=$(tail -n +2 new_jobs.csv | wc -l | tr -d ' ')
            echo "new_count=$COUNT" >> $GITHUB_OUTPUT
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "new_count=0" >> $GITHUB_OUTPUT
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi
 
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only add files that actually exist
          for f in microsoft_jobs.csv new_jobs.csv seen_ids.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m \
            "🤖 Scrape $(date +'%Y-%m-%d'): ${{ steps.check.outputs.new_count }} new SDE jobs"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Summary
        run: |
          echo "## 📊 Scrape Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          if [ -f microsoft_jobs.csv ]; then
            TOTAL=$(tail -n +2 microsoft_jobs.csv | wc -l | tr -d ' ')
          else
            TOTAL=0
          fi
          echo "| Total jobs found | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| New since last run | ${{ steps.check.outputs.new_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run time | $(date +'%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
 
