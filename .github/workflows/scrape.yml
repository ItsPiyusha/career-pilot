name: Microsoft Jobs Scraper

on:
  # ── Run automatically every day at 8 AM UTC ──
  schedule:
    - cron: "0 8 * * *"

  # ── Also allow manual trigger from GitHub UI ──
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Search keywords (comma-separated)'
        required: false
        default: 'software engineer,SDE'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit CSV back to repo

    steps:
      # ── 1. Checkout your repo ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Python ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ──
      - name: Install dependencies
        run: pip install requests

      # ── 4. Run the scraper ──
      - name: Run scraper
        run: python scraper.py
        env:
          # Pass any secrets here if needed later (e.g. Notion API key)
          PYTHONUNBUFFERED: "1"

      # ── 5. Check if there are new jobs ──
      - name: Check for new jobs
        id: check
        run: |
          if [ -f new_jobs.csv ]; then
            COUNT=$(tail -n +2 new_jobs.csv | wc -l | tr -d ' ')
            echo "new_count=$COUNT" >> $GITHUB_OUTPUT
            echo "Found $COUNT new jobs"
          else
            echo "new_count=0" >> $GITHUB_OUTPUT
          fi

      # ── 6. Commit updated CSVs back to repo ──
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add microsoft_jobs.csv new_jobs.csv seen_ids.json
          git diff --staged --quiet || git commit -m \
            "🤖 Scrape $(date +'%Y-%m-%d'): ${{ steps.check.outputs.new_count }} new SDE jobs"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 7. (Optional) Send email summary via Gmail ──
      # Uncomment and add GMAIL_USER + GMAIL_PASS secrets to use this
      # - name: Email summary
      #   if: steps.check.outputs.new_count > 0
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #     server_address: smtp.gmail.com
      #     server_port: 465
      #     username: ${{ secrets.GMAIL_USER }}
      #     password: ${{ secrets.GMAIL_PASS }}
      #     subject: "🆕 ${{ steps.check.outputs.new_count }} new Microsoft SDE jobs"
      #     to: your@email.com
      #     from: MS Job Tracker
      #     body: |
      #       ${{ steps.check.outputs.new_count }} new SDE roles posted today.
      #       Check your tracker: https://github.com/YOUR_USERNAME/YOUR_REPO/blob/main/new_jobs.csv

      # ── 8. Print summary in Actions UI ──
      - name: Summary
        run: |
          echo "## 📊 Scrape Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(tail -n +2 microsoft_jobs.csv | wc -l | tr -d ' ')
          NEW=${{ steps.check.outputs.new_count }}
          echo "| Total jobs found | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| New since last run | $NEW |" >> $GITHUB_STEP_SUMMARY
          echo "| Run time | $(date +'%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
